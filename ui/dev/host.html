<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bi-chart-mcp dev host</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #eef1f4; }
      body.dark { background: #0d1117; color: #e6edf3; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
      .frame { margin: 0 12px 12px; max-width: 760px; border-radius: 10px; overflow: hidden;
               background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 15%); }
      body.dark .frame { background: #161b22; }
      iframe { display: block; width: 100%; height: 420px; border: 0; }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>Sample <select id="sample"></select></label>
      <label><input type="checkbox" id="dark" /> Dark</label>
    </div>
    <div class="frame" id="frame"></div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
